<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
</head>
<body>
<form>
<fieldset>
<legend><b><center>Registration Form</b></legend>
<table bgcolor="red">
<tr>
    <td><label for="fname">First Name:</label></td>
    <td><input type="text" id="fname" name="first_name" required></td>
</tr>

<tr>
    <td><label for="lname">Last Name:</label></td>
    <td><input type="text" id="lname" name="last_name" required></td>
</tr>

<tr>
    <td><label for="email">Email ID:</label></td>
    <td><input type="email" id="email" name="email" required></td>
</tr>

<tr>
    <td><label for="mobile">Mobile Number:</label></td>
    <td><input type="tel" id="mobile" name="mobile" required></td>
</tr>

<tr>
    <td><label>Gender:</label></td>
    <td>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
    </td>
</tr>

<tr>
    <td><label for="dob">Date of Birth:</label></td>
    <td><input type="date" id="dob" name="dob" required></td>
</tr>

<tr>
    <td><label for="address">Address:</label></td>
    <td><textarea id="address" name="address" rows="4" cols="30"></textarea></td>
</tr>

<tr>
    <td><label for="city">City:</label></td>
    <td><input type="text" id="city" name="city" required></td>
</tr>

<tr>
    <td><label for="pincode">Pin Code:</label></td>
    <td><input type="text" id="pincode" name="pincode"maxlength="6" required></td>
</tr>

<tr>
    <td><label for="state">State:</label></td>
    <td><select id="state" name="state" required>
            <option value="">-- Select State --</option>
            <option>Andhra Pradesh</option>
            <option>Arunachal Pradesh</option>
            <option>Assam</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Goa</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Himachal Pradesh</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Manipur</option>
            <option>Meghalaya</option>
            <option>Mizoram</option>
            <option>Nagaland</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Sikkim</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Tripura</option>
            <option>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>West Bengal</option>
            <option>Andaman and Nicobar Islands</option>
            <option>Chandigarh</option>
            <option>Dadra and Nagar Haveli and Daman and Diu</option>
            <option>Delhi (NCT)</option>
            <option>Jammu and Kashmir</option>
            <option>Ladakh</option>
            <option>Lakshadweep</option>
            <option>Puducherry</option>
        </select>
    </td>
</tr>

<tr>
    <td><label for="country">Country:</label></td>
    <td>
        <select id="country" name="country" required>
            <option value="">-- Select Country --</option>
            <option>India</option>
            <option>United States</option>
            <option>United Kingdom</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Germany</option>
            <option>France</option>
            <option>Japan</option>
            <option>China</option>
        </select>
    </td>
</tr>

<tr>
    <td><label>Hobbies:</label></td>
    <td>
        <input type="checkbox" name="hobbies" value="drawing"> Drawing
        <input type="checkbox" name="hobbies" value="singing"> Singing
        <input type="checkbox" name="hobbies" value="dancing"> Dancing
        <input type="checkbox" name="hobbies" value="sketching"> Sketching
        <input type="checkbox" name="hobbies" value="Cricket"> Cricket
    </td>
</tr>

<tr>
    <td><label for="qualification">Qualification:</label></td>
    <td>
        <select id="qualification" name="qualification">
            <option value="">-- Select Qualification --</option>
            <option>10th</option>
            <option>12th</option>
            <option>Graduation</option>
            <option>Post Graduation</option>
        </select>
    </td>
</tr>

<tr>
    <td><label>Courses Applied For:</label></td>
    <td>
        <input type="radio" name="course" value="bca"> BCA
        <input type="radio" name="course" value="mca"> MCA
        <input type="radio" name="course" value="btech"> B.Tech
        <input type="radio" name="course" value="mba"> MBA
    </td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </td>
</tr>
</tabl>
</fieldset>
</form>
</body>
</html>
