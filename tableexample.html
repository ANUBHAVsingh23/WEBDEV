<!DOCTYPE html>
<html>
<head>
<title>HTML Table Attributes</title>
</head>
<body>
    <h2><center>Student Information</h2>
    <table
        border="3"
        cellpadding="10"
        cellspacing="5"
        width="700"
        height="250"
        align="center"
        bgcolor="yellow"
        frame="box"
        rules="all"
        valign="middle">

        <tr bgcolor="green">
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Anubhav</td>
            <td>MCA</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Manish</td>
            <td>BCA</td>
            <td>78</td>
        </tr>

        <tr>
            <td>Akash</td>
            <td>MCA</td>
            <td>91</td>
        </tr>
    </table>
</body>
</html>
