<!DOCTYPE html>
<html>
<head>
    <title>Student Information Form</title>
</head>
<body>
<center><img src="/images/ff.png"alt="Student Image"width="1350"height="150"></center>
<form>
<fieldset>
    <legend>
        <b>1. Personal Information</b>
    </legend>
    <table border="0" width="100%" cellpadding="8">
        <tr>
            <td width="50%">
                <b>Full Name <font color="red">*</font></b><br>
                <input type="text"placeholder="Enter your full name"size="50">
            </td>

            <td width="50%">
                <b>Email Address <font color="red">*</font></b><br>
                <input type="email"placeholder="name@example.com"size="50">
            </td>
        </tr>

        <tr>
            <td>
                <b>Phone Number <font color="red">*</font></b><br>
                <input type="tel"
                placeholder="+91 98765 43210"
                size="50">
            </td>

            <td>
                <b>Date of Birth <font color="red">*</font></b><br>
                <input type="date" size="50">
            </td>
        </tr>
        <tr>
            <td>
                <b>Age</b><br>
                <input type="number"
                value="18"
                min="1"
                max="100"
                size="50">
            </td>
